[pytest]
testpaths = tests

markers =
    postgres: real PostgreSQL integration (explicit test admin URL required)

addopts = 
    --ignore=tests/test_postgres.py
    --ignore=tests/test_auth_postgres.py
    --ignore=tests/test_registry.py
    --ignore=tests/test_work_orders_postgres.py
    --ignore=tests/test_work_order_regressions.py
    --ignore=tests/test_predictions_postgres.py
    --ignore=tests/test_ingestion_postgres.py
    --ignore=tests/test_jobs_postgres.py
    --ignore=tests/test_fleet_jobs_postgres.py
    --ignore=tests/test_mlops_postgres.py
    --ignore=tests/test_classification_postgres.py
    --ignore=tests/test_container_deployment.py
    --ignore=tests/test_phase89_regressions.py
