name: Backend behavioural tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTINEL_API_KEY: 'test-api-key-for-hermetic-unit-tests-0123456789'
      SENTINEL_MODEL_DIR: runs/fd001-v1
      SENTINEL_BUNDLE_SHA256: 06d46a9c4f5f71aeb220ade135e52e713a0bd41f362e7caf00eda743442e7cfd
      SENTINEL_CLASSIFIER_DIR: runs/all-subsets-20261030-v1/COMBINED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: >
          python -m pytest -q
          tests/test_api.py
          tests/test_auth_unit.py
          tests/test_database.py
          tests/test_foundation.py
          tests/test_pipeline.py
          tests/test_predictions_unit.py
          tests/test_rul_experiments.py
          tests/test_work_orders_unit.py
          tests/test_enterprise_security.py
          tests/test_mcp_server.py
          tests/test_mlops_pipeline.py
          tests/test_planning.py
          tests/test_notifications.py
          tests/test_integrations.py
